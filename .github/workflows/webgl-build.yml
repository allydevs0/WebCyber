name: Build WebGL (WebAssembly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Compilar WebAssembly sem Unity local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: port/UnityProject/ExportedProject/Library
          key: Library-WebGL-${{ hashFiles('port/UnityProject/ExportedProject/Assets/**', 'port/UnityProject/ExportedProject/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Setup Unity License File
        run: |
          mkdir -p "$HOME/.local/share/unity3d/Unity"
          echo "${{ secrets.UNITY_LICENSE }}" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
          chmod 644 "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
          echo "License file created ($(wc -c < "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf") bytes)"

      - name: Build WebGL via Docker Headless
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/port/UnityProject/ExportedProject:/project" \
            -v "$HOME/.local/share/unity3d/Unity:/root/.local/share/unity3d/Unity" \
            -w /project \
            unityci/editor:ubuntu-2021.3.20f1-webgl-3 \
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -silent-crashes \
              -logFile /project/unity-build.log \
              -projectPath /project \
              -executeMethod WebBuildScript.Build \
              -quit || true

      - name: Print Unity Build Log
        run: |
          echo "=== UNITY BUILD LOG (Last 200 lines) ==="
          if [ -f port/UnityProject/ExportedProject/unity-build.log ]; then
            tail -n 200 port/UnityProject/ExportedProject/unity-build.log
          else
            echo "unity-build.log was not created!"
          fi

      - name: Inspect Build Output
        run: |
          echo "=== Directory Structure of Output ==="
          ls -la build/ || true
          ls -la port/UnityProject/ExportedProject/Builds/ || true
          find port/UnityProject/ExportedProject/Builds -maxdepth 3 || true

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BombRushCyberfunk-WebAssembly
          path: |
            build/WebGL
            port/UnityProject/ExportedProject/Builds/WebGL
          if-no-files-found: warn

      - name: Deploy to GitHub Pages (Opcional)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: port/UnityProject/ExportedProject/Builds/WebGL
