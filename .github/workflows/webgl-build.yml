name: Build WebGL (WebAssembly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Compilar WebAssembly sem Unity local
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: port/UnityProject/ExportedProject/Library
          key: Library-WebGL-${{ hashFiles('port/UnityProject/ExportedProject/Assets/**', 'port/UnityProject/ExportedProject/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL Player via GameCI (Docker Headless)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 2021.3.20f1
          projectPath: port/UnityProject/ExportedProject
          buildMethod: WebBuildScript.Build

      - name: Inspect Build Output
        run: |
          echo "=== Directory Structure of Output ==="
          ls -la build/ || true
          ls -la build/WebGL/ || true
          find build -maxdepth 3 || true

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BombRushCyberfunk-WebAssembly
          path: |
            build/WebGL
            port/UnityProject/ExportedProject/Builds/WebGL
          if-no-files-found: warn

      - name: Deploy to GitHub Pages (Opcional)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL
